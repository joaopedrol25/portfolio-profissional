<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <style>
    .bracket {
      font-family: 'Fira Code', 'Courier New', monospace;
      font-weight: 600;
      fill: #38bdf8;
    }
    .text {
      font-family: 'Plus Jakarta Sans', 'Segoe UI', sans-serif;
      font-weight: 800;
      fill: #f8fafc;
    }
    .logo-text {
      font-size: 13px;
      dominant-baseline: central;
      text-anchor: middle;
    }
    .outline {
      fill: none;
      stroke: url(#fav-grad);
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    @media (prefers-color-scheme: light) {
      .text { fill: #0f172a; }
      .bracket { fill: #0284c7; }
    }
  </style>
  <defs>
    <linearGradient id="fav-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
  </defs>
  <!-- Hexagon outline centered in 64x64 (center is 32, 32) -->
  <polygon points="32,7 55,20 55,44 32,57 9,44 9,20" class="outline" />
  <!-- Logo Text centered inside the hexagon -->
  <text x="32" y="32" class="logo-text">
    <tspan class="bracket">&lt;</tspan>
    <tspan class="text">JP</tspan>
    <tspan class="bracket">&#160;/&gt;</tspan>
  </text>
</svg>
