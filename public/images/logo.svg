<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" width="100%" height="100%">
  <style>
    .bracket {
      font-family: 'Fira Code', 'Courier New', monospace;
      font-weight: 600;
      fill: #38bdf8;
    }
    .text {
      font-family: 'Plus Jakarta Sans', 'Segoe UI', sans-serif;
      font-weight: 800;
      fill: #f8fafc;
    }
    .logo-text {
      font-size: 28px;
      dominant-baseline: central;
    }
    .outline {
      fill: none;
      stroke: url(#logo-grad);
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    @media (prefers-color-scheme: light) {
      .text { fill: #0f172a; }
      .bracket { fill: #0284c7; }
    }
  </style>
  <defs>
    <linearGradient id="logo-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
  </defs>
  <!-- Hexagon Icon on the Left (centered at x=25, y=25 in its local space) -->
  <g transform="translate(10, 5)">
    <polygon points="25,3 45,15 45,35 25,47 5,35 5,15" class="outline" />
    <text x="25" y="25" font-size="12" font-family="'Fira Code', monospace" font-weight="600" fill="#38bdf8" dominant-baseline="central" text-anchor="middle">&lt;/&gt;</text>
  </g>
  <!-- Logo Text on the Right -->
  <text x="70" y="30" class="logo-text">
    <tspan class="bracket">&lt;</tspan>
    <tspan class="text">JP</tspan>
    <tspan class="bracket">&#160;/&gt;</tspan>
  </text>
</svg>
